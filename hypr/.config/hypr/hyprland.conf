#      ░▒▒▒░░░░░▓▓          ___________ #    ░░▒▒▒░░░░░▓▓        //___________/ #   ░░▒▒▒░░░░░▓▓     _   _ _    _ _____ #   ░░▒▒░░░░░▓▓▓▓▓▓ | | | | |  | |  __/ #    ░▒▒░░░░▓▓   ▓▓ | |_| | |_/ /| |___ #     ░▒▒░░▓▓   ▓▓   \__  |____/ |____/ #       ░▒▓▓   ▓▓  //____/  # █▀▄▀█ █▀█ █▄░█ █ ▀█▀ █▀█ █▀█ # █░▀░█ █▄█ █░▀█ █ ░█░ █▄█ █▀▄ # See https://wiki.hyprland.org/Configuring/Monitors/
monitor = ,preferred,auto,auto # █░░ ▄▀█ █░█ █▄░█ █▀▀ █░█ # █▄▄ █▀█ █▄█ █░▀█ █▄▄ █▀█ # See https://wiki.hyprland.org/Configuring/Keywords/
exec-once = /home/l0wkey/.local/share/bin/resetxdgportal.sh # reset XDPH for screenshare
exec-once = dbus-update-activation-environment --systemd --all # for XDPH
exec-once = /home/l0wkey/.local/share/bin/polkitkdeauth.sh # authentication dialogue for GUI appsexec-once
exec-once = waybar # launch the system bar
exec-once = blueman-applet # systray app for Bluetooth
exec-once = udiskie --no-automount --smart-tray # front-end that allows to manage removable media
exec-once = nm-applet --indicator # systray app for Network/Wifi
exec-once = dunst # start notification demon
exec-once = wl-paste --type text --watch cliphist store # clipboard store text data
exec-once = wl-paste --type image --watch cliphist store # clipboard store image data
# exec-once = /home/l0wkey/.local/share/bin/mpvallpaper-start.sh # deprecated
exec-once = awww-daemon # start awww wallpaper daemon
exec-once = awww restore # restore last wallpaper
exec-once = hyprctl setcursor Bibata-Modern-Ice 20 # set cursor theme
exec-once = /home/l0wkey/.local/share/bin/themeswitch.sh # start theme daemon
exec-once = /home/l0wkey/.local/share/bin/batterynotify.sh # battery notification # █▀▀ █▄░█ █░█ # ██▄ █░▀█ ▀▄▀ # See https://wiki.hyprland.org/Configuring/Environment-variables/
env = PATH,$PATH:/home/l0wkey/.local/share/bin
env = XDG_CURRENT_DESKTOP,Hyprland:KDE
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_QPA_PLATFORMTHEME,qt6ct
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = GTK_THEME,adw-gtk3-dark

env = QT_STYLE_OVERRIDE,Breeze
env = SDL_VIDEO_X11_DGAMOUSE,0
env = QT_AUTO_SCREEN_SCALE_FACTOR,1
env = MOZ_ENABLE_WAYLAND,1
env = GDK_SCALE,1
env = LIBVA_DRIVER_NAME,iHD # VAAPI for QtWebEngine
env = QTWEBENGINE_DISABLE_GPU,0 # Enable GPU for QtWebEngine
env = ELECTRON_OZONE_PLATFORM_HINT,auto # GPU acceleration
# █ █▄░█ █▀█ █░█ ▀█▀ # █ █░▀█ █▀▀ █▄█ ░█░ # See https://wiki.hyprland.org/Configuring/Variables/
input { kb_layout = us follow_mouse = 1 touchpad { natural_scroll = no } sensitivity = 0 force_no_accel = 1 numlock_by_default = true } # See https://wiki.hyprland.org/Configuring/Keywords/#executing
device { name = epic mouse V1 sensitivity = -0.5 } # See https://wiki.hyprland.org/Configuring/Variables/
#gestures { workspace_swipe = true
#    workspace_swipe_fingers = 3
#}

#
env = XCURSOR_THEME,Future-Cyan
#
env = XCURSOR_SIZE,24

env = HYPRCURSOR_SIZE,24


# █░░ ▄▀█ █▄█ █▀█ █░█ ▀█▀ █▀
# █▄▄ █▀█ ░█░ █▄█ █▄█ ░█░ ▄█

# See https://wiki.hyprland.org/Configuring/Dwindle-Layout/

#dwindle {
#    pseudotile = yes
#    preserve_split = yes
#}

# See https://wiki.hyprland.org/Configuring/Master-Layout/

master {
    new_status = master
}


# █▀▄▀█ █ █▀ █▀▀
# █░▀░█ █ ▄█ █▄▄

# See https://wiki.hyprland.org/Configuring/Variables/

misc {
    vrr = 0
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0
}

xwayland {
    force_zero_scaling = true
}


# █▀ █▀█ █░█ █▀█ █▀▀ █▀▀
# ▄█ █▄█ █▄█ █▀▄ █▄▄ ██▄

source = ~/.config/hypr/animations.conf
source = ~/.config/hypr/keybindings.conf
source = ~/.config/hypr/windowrules.conf
source = ~/.config/hypr/themes/common.conf # shared theme settings
# hyprlang noerror true
source = ~/.config/hypr/themes/theme.conf # theme specific settings
# hyprlang noerror false
source = ~/.config/hypr/themes/colors.conf # wallbash color override
source = ~/.config/hypr/monitors.conf # initially empty, to be configured by user and remains static
source = ~/.config/hypr/userprefs.conf # initially empty, to be configured by user and remains static

# Note: as userprefs.conf is sourced at the end, settings configured in this file will override the defaults


