set -g base-index 1
setw -g pane-base-index 1

# Automatically set window title
set-window-option -g automatic-rename on
set-option -g set-titles on
set -g set-titles-string "#T"

set -g status-keys vi
set -g history-limit 10000

setw -g mode-keys vi
setw -g mouse on
setw -g monitor-activity on

# Kill window when pane exits
set -g remain-on-exit off

# Split panes
bind v split-window -h
bind s split-window -v

# Resize panes (hold to repeat)
bind -r H resize-pane -L 5
bind -r L resize-pane -R 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5

# Navigate panes
bind h select-pane -L
bind j select-pane -D 
bind k select-pane -U
bind l select-pane -R

# More navigation
bind o select-pane -t :.+
bind x kill-pane
bind '`' last-window

# Shift arrow to switch windows
bind -n S-Left  previous-window
bind -n S-Right next-window

# New window (prompts for name)
bind c command-prompt -p "Window name: " "new-window -n '%%'"

# Fuzzy window switcher with fzf
bind f run-shell "tmux list-windows -t '#{session_name}' | fzf --prompt=Switch: | cut -d: -f1 | xargs -I{} tmux select-window -t {}"

# No delay for escape key press
set -sg escape-time 0

# Reload tmux config
bind r source-file ~/.tmux.conf

# Mouse to copy mode
bind-key -n MouseDown1Pane select-pane -M

# Move pane to window (interactive)
bind a command-prompt -p "join pane from:" "join-pane -s ':%%'"
bind y command-prompt -p "send pane to:" "join-pane -t '%%'"

# Join pane from window - current session only
bind @ run-shell "/home/l0wkey/.local/bin/tmux-join-pane-picker.sh"

# Sync panes (mirror input to all panes)
bind e setw synchronize-panes

set -g status-style bg=default,fg=colour12
setw -g window-status-current-style bg=default,fg=colour14,bold
set -g status-interval 5
set -g status-left ''
set -g status-right ' %Y-%m-%d %H:%M '
